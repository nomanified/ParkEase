<!-- =========================
     PARKING MANAGEMENT
========================= -->

<div class="section">

    <div class="section-header">

        <div>
            <h2>Parking Management</h2>
            <span>Add, edit, delete and manage parking spots.</span>
        </div>

        <button
            id="addParkingButton"
            class="action-button"
            type="button"
        >
            ➕ Add Parking Spot
        </button>

    </div>


    <div
        id="parkingManagementList"
        class="parking-list"
    >

        <div class="empty-box">
            <h3>Loading parking management...</h3>
            <p>Please wait.</p>
        </div>

    </div>

</div>


<!-- =========================
     ADD / EDIT PARKING MODAL
========================= -->

<div
    id="parkingModal"
    class="modal"
    style="display:none;"
>

    <div class="modal-content">

        <div class="section-header">

            <h2 id="parkingModalTitle">
                Add Parking Spot
            </h2>

            <button
                id="closeParkingModal"
                type="button"
            >
                ✕
            </button>

        </div>


        <form id="parkingForm">

            <input
                type="hidden"
                id="parkingId"
            >


            <div class="form-group">

                <label for="spotNumber">
                    Spot Number
                </label>

                <input
                    type="text"
                    id="spotNumber"
                    placeholder="e.g. A-101"
                    required
                >

            </div>


            <div class="form-group">

                <label for="parkingLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="parkingLocation"
                    placeholder="e.g. Main Campus"
                    required
                >

            </div>


            <div class="form-group">

                <label for="parkingType">
                    Parking Type
                </label>

                <select
                    id="parkingType"
                    required
                >

                    <option value="">
                        Select Type
                    </option>

                    <option value="Car">
                        Car
                    </option>

                    <option value="Bike">
                        Bike
                    </option>

                    <option value="EV">
                        EV
                    </option>

                    <option value="Disabled">
                        Disabled
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="pricePerHour">
                    Price Per Hour
                </label>

                <input
                    type="number"
                    id="pricePerHour"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 100"
                    required
                >

            </div>


            <div class="form-group">

                <label for="parkingStatus">
                    Status
                </label>

                <select id="parkingStatus">

                    <option value="Available">
                        Available
                    </option>

                    <option value="Occupied">
                        Occupied
                    </option>

                    <option value="Reserved">
                        Reserved
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="availableTime">
                    Available Time
                </label>

                <input
                    type="text"
                    id="availableTime"
                    placeholder="e.g. 8 AM - 10 PM"
                >

            </div>


            <div class="form-group">

                <label for="parkingInstructions">
                    Parking Instructions
                </label>

                <textarea
                    id="parkingInstructions"
                    placeholder="Enter parking instructions"
                    rows="3"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="parkingDescription">
                    Description
                </label>

                <textarea
                    id="parkingDescription"
                    placeholder="Enter parking description"
                    rows="3"
                ></textarea>

            </div>


            <button
                type="submit"
                id="saveParkingButton"
                class="action-button"
            >
                Save Parking Spot
            </button>


            <p id="parkingFormMessage"></p>

        </form>

    </div>

</div>
